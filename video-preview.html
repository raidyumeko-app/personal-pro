<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personal Pro · Vídeo do exercício</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/redesign.css">
  <link rel="stylesheet" href="/premium-visual.css">
  <link rel="stylesheet" href="/portal.css">
  <style>body{margin:0;background:#0e1117;color:#f1f3f7;font-family:system-ui,sans-serif;--surface-2:#191e27;--surface-3:#252c37;--border:#333b47;--text-dim:#b5bdca;--lime:#c4f36b}main{max-width:560px;padding:24px 16px;margin:auto}header small{color:#c4f36b;font-weight:800;letter-spacing:2px}header h1{font-size:24px}header p{color:#b5bdca;line-height:1.5}a{color:#c4f36b}</style>
</head>
<body>
  <main>
    <header><small>PERSONAL PRO</small><h1>Vídeos dos exercícios</h1><p>Escolha o exercício e confira o vídeo na tela de execução. Esta prévia não salva registros.</p></header>
    <div id="preview"></div>
    <p><a href="/">Abrir Personal Pro</a></p>
  </main>
  <script src="/app-ui.js"></script>
  <script src="/exercise-media.js"></script>
  <script src="/personal-pro-generated-videos.js"></script>
  <script src="/workout-session.js"></script>
  <script src="/workout-session-preview.js"></script>
  <script type="module">
    import React from 'https://esm.sh/react@19.1.0';
    import {createRoot} from 'https://esm.sh/react-dom@19.1.0/client';
    const root=createRoot(document.getElementById('preview'));
    async function load(){
      const responses=await Promise.all(['/exercise-library.json','/exercise-instructions.pt.json'].map(url=>fetch(url)));
      if(responses.some(response=>!response.ok))throw Error('Não foi possível carregar as descrições.');
      const [catalog,translations]=await Promise.all(responses.map(response=>response.json()));
      const byId=new Map(catalog.map(item=>[item.id,item]));
      const items=window.PersonalProGeneratedVideos.items.filter(item=>item.linkAllowed&&item.sourceId);
      const exercises=items.map(item=>{
        const entry=byId.get(item.sourceId);
        if(!entry)throw Error('Exercício vinculado não encontrado.');
        return {...entry,instructions:translations[entry.id],preferredGeneratedVideoId:item.id,series:'3',repetitions:'12',rest:60};
      });
      const requested=new URLSearchParams(location.search).get('video');
      function Preview(){
        const [selected,setSelected]=React.useState(Math.max(0,items.findIndex(item=>item.id===requested)));
        const ex=exercises[selected];
        return React.createElement(React.Fragment,null,
          React.createElement('p',null,items.length+' vídeos vinculados · revisão final pendente'),
          React.createElement('label',{className:'pp-field',style:{display:'block',marginBottom:20}},'Escolha um vídeo vinculado',
            React.createElement('select',{'aria-label':'Vídeo vinculado',value:selected,onChange:event=>setSelected(Number(event.target.value)),style:{width:'100%',padding:12,background:'#191e27',color:'#f1f3f7',border:'1px solid #333b47',borderRadius:10}},
              exercises.map((ex,index)=>React.createElement('option',{key:items[index].id,value:index},(index+1)+'. '+ex.name)))),
          React.createElement(window.PersonalProSessionPreview.Simulator,{key:items[selected].id,React,day:'A',studentId:'video-preview',exercises:[ex]}),
          React.createElement('p',null,React.createElement('a',{href:'/videos-gerados.html'},'Abrir todos os arquivos e notas da revisão')));
      }
      root.render(React.createElement(Preview));
    }
    load().catch(error=>root.render(React.createElement('p',{role:'alert'},error.message)));
  </script>
</body>
</html>
